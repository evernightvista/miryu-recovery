<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The rollback helper is D-Bus activated and runs as root -->
  <policy user="root">
    <allow own="org.miryugaming.recovery.helper"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.miryugaming.recovery.helper"/>
  </policy>
</busconfig>
